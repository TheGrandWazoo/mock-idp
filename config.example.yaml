auth_mode: lax
cors_allow_origins: ["*"]

# admin_token accepts a plain string (fine for local dev) or a secret reference.
# Secret references are resolved at startup and on hot-reload; the resolved value
# is never written back to disk or exposed through debug endpoints.
admin_token: change-me-in-real-deployments
# admin_token:
#   from_env: MOCK_IDP_ADMIN_TOKEN        # reads os.environ["MOCK_IDP_ADMIN_TOKEN"]
# admin_token:
#   from_file: /var/run/secrets/admin-token  # reads file contents (trimmed)

# Per-issuer auth_mode overrides. The URL slug (e.g. /strict-issuer/token)
# maps to "lax" or "strict", overriding the global auth_mode above.
# issuer_modes:
#   strict-issuer: strict
#   permissive-issuer: lax

# Webhook on token issuance. The mock POSTs a JSON payload to each URL
# whenever a token is issued at the /token endpoint. Use in integration tests
# to assert what was issued without scraping logs.
# webhooks:
#   - url: http://localhost:9090/events
#     events: [token_issued]
#     timeout_seconds: 5

tenants:
  22222222-2222-2222-2222-222222222222:
    provider: entra_id

    # realm_roles: applied to EVERY identity in this tenant, regardless of audience.
    # Simulates Keycloak realm roles or Entra ID directory-scoped roles.
    # realm_roles:
    #   - offline_access
    #   - uma_authorization

    users:
      alice:
        # password also accepts a secret reference:
        # password:
        #   from_env: MOCK_IDP_ALICE_PASSWORD
        # password:
        #   from_file: /var/run/secrets/alice-pw
        password: alice-pw
        # realm_roles: roles always in alice's token, any audience (identity-level)
        # realm_roles:
        #   - User.Admin
        upn: alice@example.com
        preferred_username: alice@example.com
        oid: 11111111-1111-1111-1111-aaaaaaaaaaaa
        token_version: v2
        token_lifetime_seconds: 300
        groups: [platform-team]
        allowed_audiences:
          - api://serviceB
          - api://serviceC
        extra_claims:
          department: engineering
          cost_center: cc-1234

      bob:
        password: bob-pw
        upn: bob@example.com
        preferred_username: bob@example.com
        oid: 11111111-1111-1111-1111-bbbbbbbbbbbb
        token_version: v2
        token_lifetime_seconds: 300
        groups: [analytics-team]
        allowed_audiences: [api://serviceB]

    service_principals:
      service-a:
        client_id: 01010101-1010-1010-1010-aaaaaaaaaaaa
        # secret also accepts a secret reference:
        # secret:
        #   from_env: MOCK_IDP_SERVICE_A_SECRET
        # secret:
        #   from_file: /var/run/secrets/service-a-secret
        secret: serviceA-secret
        label: ServiceA
        token_version: v1
        token_lifetime_seconds: 3600
        groups: [service-accounts]
        allowed_audiences: [api://serviceB]
        extra_claims:
          tier: 1

      service-b:
        client_id: 02020202-2020-2020-2020-bbbbbbbbbbbb
        secret: serviceB-secret
        label: ServiceB
        token_version: v1
        signing_alg: ES256
        groups: [service-accounts]
        allowed_audiences: [api://serviceC]

      "00000000-0000-0000-0000-000000000000":
        secret: admin-secret
        label: TestAdmin
        override_any_claim: true
        # override_iss_too: true  # uncomment to allow iss claim override (negative iss-validation testing)

    clients:
      api://serviceB:
        app_id: 01010101-1010-1010-1010-bbbbbbbbbbbb
        label: Service B API
        roles: [operator, responder, m2m]
        grants:
          alice: [operator, responder]
          service-a: [m2m]

      api://serviceC:
        app_id: 02020202-2020-2020-2020-cccccccccccc
        label: Service C API
        roles: [reader, admin, m2m]
        grants:
          alice: [reader]
          service-b: [m2m]

  # ── Okta-shaped tenant ────────────────────────────────────────────────────
  # Tokens use Okta claim shape: sub=email, uid=oid UUID, cid=client_id,
  # scp=space-delimited string, groups array. No tid/ver/oid claim.
  okta-tenant:
    provider: okta
    users:
      carol:
        password: carol-pw
        upn: carol@example.com
        preferred_username: carol@example.com
        oid: 33333333-3333-3333-3333-aaaaaaaaaaaa
        token_lifetime_seconds: 3600
        groups: [okta-users]
        allowed_audiences: [api://okta-api]

    service_principals:
      okta-service:
        client_id: okta-client-id
        secret: okta-service-secret
        allowed_audiences: [api://okta-api]

    clients:
      api://okta-api:
        label: Okta API
        roles: [read, write]
        grants:
          carol: [read]
          okta-service: [read, write]

  # ── Cognito-shaped tenant ─────────────────────────────────────────────────
  # Tokens use AWS Cognito access token shape: token_use=access,
  # cognito:username, cognito:groups, scope=space-delimited, client_id.
  cognito-tenant:
    provider: cognito
    users:
      dave:
        password: dave-pw
        upn: dave@example.com
        preferred_username: dave
        oid: 44444444-4444-4444-4444-aaaaaaaaaaaa
        token_lifetime_seconds: 3600
        groups: [cognito-users]
        allowed_audiences: [api://cognito-api]

    service_principals:
      cognito-service:
        client_id: cognito-client-id
        secret: cognito-service-secret
        allowed_audiences: [api://cognito-api]

    clients:
      api://cognito-api:
        label: Cognito API
        roles: [read, write]
        grants:
          dave: [read]
          cognito-service: [read, write]

  # ── Keycloak-shaped tenant ────────────────────────────────────────────────
  # Tokens use Keycloak shape: realm_access.roles, resource_access.<client>.roles,
  # preferred_username, email, azp. No tid/ver/oid claim.
  keycloak-tenant:
    provider: keycloak
    users:
      eve:
        password: eve-pw
        upn: eve@example.com
        preferred_username: eve
        oid: 55555555-5555-5555-5555-aaaaaaaaaaaa
        token_lifetime_seconds: 3600
        groups: [keycloak-users]
        allowed_audiences: [api://keycloak-api]

    service_principals:
      keycloak-service:
        client_id: keycloak-client-id
        secret: keycloak-service-secret
        allowed_audiences: [api://keycloak-api]

    clients:
      api://keycloak-api:
        label: Keycloak API
        roles: [read, write]
        grants:
          eve: [read]
          keycloak-service: [read, write]
