routes:
  # Plugin-free health probe — used by the Docker healthcheck so that a
  # spinning openid-connect init_worker loop doesn't block the health check.
  # id must be a positive integer; 0 is rejected by APISIX schema validation.
  - id: 100
    uri: /_health
    upstream:
      type: roundrobin
      nodes:
        "httpbin:8080": 1
    plugins:
      proxy-rewrite:
        uri: "/status/200"

  - id: 1
    uri: /alpha/*
    upstream:
      type: roundrobin
      nodes:
        "httpbin:8080": 1
    plugins:
      proxy-rewrite:
        regex_uri: ["^/alpha/(.*)", "/$1"]
      openid-connect:
        bearer_only: true
        realm: apisix
        client_id: "api://alpha-api"
        client_secret: "placeholder"
        discovery: "http://mock-idp:8080/it-tenant/.well-known/openid-configuration"
        ssl_verify: false
        set_userinfo_header: true

  - id: 2
    uri: /beta/*
    upstream:
      type: roundrobin
      nodes:
        "httpbin:8080": 1
    plugins:
      proxy-rewrite:
        regex_uri: ["^/beta/(.*)", "/$1"]
      openid-connect:
        bearer_only: true
        realm: apisix
        client_id: "api://beta-api"
        client_secret: "placeholder"
        discovery: "http://mock-idp:8080/it-tenant/.well-known/openid-configuration"
        ssl_verify: false
        set_userinfo_header: true

#END
