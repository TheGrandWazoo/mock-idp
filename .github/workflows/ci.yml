name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "src/**"
      - "tests/**"
      - "pyproject.toml"
      - "uv.lock"
      - "Dockerfile"
      - "docker-compose.integration.yml"
      - "chart/**"
      - ".github/workflows/**"
      - ".github/scripts/**"
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "pyproject.toml"
      - "uv.lock"
      - "Dockerfile"
      - "docker-compose.integration.yml"
      - "chart/**"
      - ".github/workflows/**"
      - ".github/scripts/**"

permissions:
  contents: read

env:
  IMAGE: ghcr.io/thegrandwazoo/mock-idp
  OWNER: thegrandwazoo
  PACKAGE: mock-idp

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6

      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b  # v8.1.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint
        run: uv run ruff check src tests

      - name: Test
        run: uv run pytest tests -v
        env:
          CONFIG_PATH: config.example.yaml
          ISS_BASE: http://localhost:8080

      - name: Lint Helm chart
        run: helm lint chart/

      - name: Check chart appVersion matches pyproject.toml
        run: |
          APP_VER=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          CHART_VER=$(python3 -c "import yaml; print(yaml.safe_load(open('chart/Chart.yaml'))['appVersion'])")
          if [ "$APP_VER" != "$CHART_VER" ]; then
            echo "ERROR: chart appVersion ($CHART_VER) does not match pyproject.toml ($APP_VER)"
            echo "Update chart/Chart.yaml appVersion to $APP_VER"
            exit 1
          fi
          echo "chart appVersion $CHART_VER matches pyproject.toml"

  build:
    runs-on: ubuntu-latest
    needs: lint-test
    permissions:
      contents: write       # create/delete releases and git tags
      packages: write       # push and delete GHCR images
      security-events: write

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6

      - name: Extract version
        id: ver
        run: |
          V=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          S="${GITHUB_SHA:0:7}"
          echo "version=$V"            >> "$GITHUB_OUTPUT"
          echo "short_sha=$S"          >> "$GITHUB_OUTPUT"
          echo "sha_tag=${V}-sha-${S}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121  # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata (release tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        id: meta
        uses: docker/metadata-action@030e881283bb7a6894de51c315a6bfe6a94e05cf  # v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            # pre-release tags (v1.2.3-alpha, -beta, -rc): version tag only, no latest
            type=match,pattern=v(\d+\.\d+\.\d+-.+),group=1,enable=${{ contains(github.ref, '-') }}
            # stable release tags: version tag + latest
            type=match,pattern=v(\d+\.\d+\.\d+$),group=1
            type=raw,value=latest,enable=${{ !contains(github.ref, '-') }}

      - name: Build image
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f  # v7
        with:
          context: .
          load: true
          push: false
          tags: mock-idp:smoke
          labels: ${{ steps.meta.outputs.labels }}

      - name: Smoke test
        run: |
          docker run -d --name mock-idp-smoke \
            -p 8080:8080 \
            -e CONFIG_PATH=/etc/mock-idp/config.yaml \
            -e ISS_BASE=http://localhost:8080 \
            -v "$(pwd)/config.example.yaml:/etc/mock-idp/config.yaml:ro" \
            mock-idp:smoke

          printf 'Waiting for /healthz'
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8080/healthz > /dev/null; then echo ' ok'; break; fi
            printf '.'
            sleep 1
            [ "$i" -eq 30 ] && { echo; echo "ERROR: healthz timed out"; docker logs mock-idp-smoke; exit 1; }
          done

          echo "Testing password grant..."
          TOKEN=$(curl -sf -X POST http://localhost:8080/smoke/token \
            -d 'grant_type=password&username=alice&password=alice-pw&resource=api://serviceB' \
            | python3 -c "import sys,json; print(json.load(sys.stdin).get('access_token',''))")
          [ -n "$TOKEN" ] \
            || { echo "ERROR: password grant returned no token"; docker logs mock-idp-smoke; exit 1; }

          echo "Testing client_credentials grant..."
          TOKEN=$(curl -sf -X POST http://localhost:8080/smoke/token \
            -d 'grant_type=client_credentials&client_id=01010101-1010-1010-1010-aaaaaaaaaaaa&client_secret=serviceA-secret&resource=api://serviceB' \
            | python3 -c "import sys,json; print(json.load(sys.stdin).get('access_token',''))")
          [ -n "$TOKEN" ] \
            || { echo "ERROR: client_credentials grant returned no token"; docker logs mock-idp-smoke; exit 1; }

          echo "Testing token_exchange grant (RFC 8693)..."
          SUBJECT_TOKEN=$(curl -sf -X POST http://localhost:8080/smoke/token \
            -d 'grant_type=password&username=alice&password=alice-pw&resource=api://serviceB' \
            | python3 -c "import sys,json; print(json.load(sys.stdin).get('access_token',''))")
          TOKEN=$(curl -sf -X POST http://localhost:8080/smoke/token \
            --data-urlencode 'grant_type=urn:ietf:params:oauth:grant-type:token-exchange' \
            --data-urlencode "subject_token=${SUBJECT_TOKEN}" \
            --data-urlencode 'subject_token_type=urn:ietf:params:oauth:token-type:access_token' \
            -d 'client_id=01010101-1010-1010-1010-aaaaaaaaaaaa&client_secret=serviceA-secret&audience=api://serviceB' \
            | python3 -c "import sys,json; print(json.load(sys.stdin).get('access_token',''))")
          [ -n "$TOKEN" ] \
            || { echo "ERROR: token_exchange grant returned no token"; docker logs mock-idp-smoke; exit 1; }

          echo "All smoke tests passed."
          docker stop mock-idp-smoke && docker rm mock-idp-smoke

      - name: Scan with Trivy (SARIF)
        if: github.event_name != 'pull_request'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          image-ref: mock-idp:smoke
          format: sarif
          output: trivy-results.sarif
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH

      - name: Upload Trivy results to GitHub Security
        if: github.event_name != 'pull_request' && always() && hashFiles('trivy-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@87557b9c84dde89fdd9b10e88954ac2f4248e463  # v4
        with:
          sarif_file: trivy-results.sarif

      - name: Fail on HIGH/CRITICAL vulnerabilities
        if: github.event_name != 'pull_request'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          image-ref: mock-idp:smoke
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH

      # ── sha build (push to main) ────────────────────────────────────────

      - name: Push sha image
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          TAG="${{ steps.ver.outputs.sha_tag }}"
          docker tag mock-idp:smoke "${{ env.IMAGE }}:${TAG}"
          docker push "${{ env.IMAGE }}:${TAG}"

      - name: Create sha draft release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          V="${{ steps.ver.outputs.version }}"
          SHA_TAG="${{ steps.ver.outputs.sha_tag }}"
          gh release create "v${SHA_TAG}" \
            --title "v${SHA_TAG}" \
            --draft \
            --target "$GITHUB_SHA" \
            --notes "Development build toward v${V}. Image: \`${{ env.IMAGE }}:${SHA_TAG}\`"

      - name: Clean up previous sha drafts and images
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ env.OWNER }}
          PACKAGE: ${{ env.PACKAGE }}
        run: |
          bash .github/scripts/cleanup-sha-artifacts.sh \
            "${{ steps.ver.outputs.version }}" \
            "${{ steps.ver.outputs.sha_tag }}"

      # ── release tag (v*) ───────────────────────────────────────────────

      - name: Push release image
        if: github.event_name != 'pull_request' && startsWith(github.ref, 'refs/tags/v')
        run: |
          while IFS= read -r tag; do
            [ -z "$tag" ] && continue
            docker tag mock-idp:smoke "$tag"
            docker push "$tag"
          done <<< "${{ steps.meta.outputs.tags }}"

      - name: Clean up sha drafts and images for this version
        if: github.event_name != 'pull_request' && startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ env.OWNER }}
          PACKAGE: ${{ env.PACKAGE }}
        run: |
          bash .github/scripts/cleanup-sha-artifacts.sh \
            "${{ steps.ver.outputs.version }}"

      - name: Create release draft
        if: github.event_name != 'pull_request' && startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          V="${{ steps.ver.outputs.version }}"
          REF_TAG="${GITHUB_REF#refs/tags/}"
          gh release create "$REF_TAG" \
            --title "$REF_TAG" \
            --draft \
            --notes "Release $REF_TAG. Image: \`${{ env.IMAGE }}:${V}\`"

  # ── integration tests (main + PR only, not release tags) ───────────────────
  integration-test:
    runs-on: ubuntu-latest
    needs: lint-test
    if: github.ref == 'refs/heads/main' || github.event_name == 'pull_request'
    permissions:
      contents: read
      issues: write

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6

      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b  # v8.1.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Build mock-idp image
        run: docker build -t mock-idp:integration .

      - name: Start integration stack
        run: docker compose -f docker-compose.integration.yml up -d --wait
        timeout-minutes: 5

      - name: Run integration tests
        id: integration
        run: uv run pytest tests/integration/ -v --tb=short

      - name: Dump APISIX logs on failure
        if: failure()
        run: docker compose -f docker-compose.integration.yml logs apisix 2>/dev/null || true

      - name: Dump mock-idp logs on failure
        if: failure()
        run: docker compose -f docker-compose.integration.yml logs mock-idp 2>/dev/null || true

      - name: Diagnose APISIX container on failure
        if: failure()
        timeout-minutes: 2
        run: |
          echo "=== APISIX health check history ==="
          docker inspect mock-idp-apisix-1 2>/dev/null \
            | python3 -c 'import sys,json; d=json.load(sys.stdin); c=d[0] if d else {}; s=c.get("State",{}); h=s.get("Health",{}); print("status:",s.get("Status")); print("health:",h.get("Status")); [print("  exit=%s out=%r"%(l["ExitCode"],(l.get("Output") or "").strip()[:120])) for l in (h.get("Log") or [])[-5:]]' \
            || echo "docker inspect failed"
          echo "=== Port 9080 in container netns ==="
          CPID=$(docker inspect mock-idp-apisix-1 --format '{{.State.Pid}}' 2>/dev/null)
          if [ -n "$CPID" ] && [ "$CPID" != "0" ]; then
            grep -i ':2378' /proc/$CPID/net/tcp /proc/$CPID/net/tcp6 2>/dev/null \
              && echo "port 9080 IS bound" || echo "port 9080 NOT bound"
          fi
          echo "=== nginx error log (timeout-guarded) ==="
          timeout 5 docker exec mock-idp-apisix-1 \
            tail -10 /usr/local/apisix/logs/error.log 2>/dev/null || echo "exec timed out or no log"

      - name: Stop integration stack
        if: always()
        run: docker compose -f docker-compose.integration.yml down

      - name: Open issue on integration test failure
        if: failure() && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh label create integration-failure --color d93f0b \
            --description "Automated: integration test failure" 2>/dev/null || true

          EXISTING=$(gh issue list --label integration-failure --state open \
            --json number --jq '.[0].number // empty')

          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body \
              "Still failing on [\`${GITHUB_SHA:0:7}\`](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"
          else
            BODY_FILE=$(mktemp)
            printf 'Integration tests failed.\n\n**Commit:** [%s](%s/commit/%s)\n**Run:** %s/actions/runs/%s\n\nCheck the workflow logs for APISIX and mock-idp output. This issue will be automatically closed when integration tests pass again.\n' \
              "${GITHUB_SHA:0:7}" \
              "${{ github.server_url }}/${{ github.repository }}" \
              "${{ github.sha }}" \
              "${{ github.server_url }}/${{ github.repository }}" \
              "${{ github.run_id }}" \
              > "$BODY_FILE"
            gh issue create \
              --title "Integration test failure: ${GITHUB_SHA:0:7}" \
              --label integration-failure \
              --body-file "$BODY_FILE"
            rm -f "$BODY_FILE"
          fi

      - name: Close integration failure issue on success
        if: success() && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          EXISTING=$(gh issue list --label integration-failure --state open \
            --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            gh issue close "$EXISTING" --comment \
              "Integration tests passed on [\`${GITHUB_SHA:0:7}\`](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}). Closing."
          fi
