[project]
name = "mock-idp"
version = "0.7.1"
requires-python = ">=3.14"
dependencies = [
    "fastapi==0.136.1",
    "uvicorn[standard]==0.47.0",
    "httpx==0.28.1",
    "python-multipart==0.0.28",
    "pyyaml==6.0.3",
    "pydantic==2.13.4",
    "watchfiles>=1.2.0",
    "joserfc>=1.6.5",
]

[project.optional-dependencies]
postgres = [
    "asyncpg>=0.30",
    "sqlalchemy[asyncio]>=2.0.49",
    "alembic>=1.14",
]
metrics = [
    "prometheus-fastapi-instrumentator>=7.0",
]
ratelimit = [
    "slowapi>=0.1.9",
]

[dependency-groups]
dev = [
    "ruff==0.15.13",
    "pytest==9.0.3",
    "prometheus-fastapi-instrumentator>=7.0",
    "slowapi>=0.1.9",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = "--ignore=tests/integration"

[tool.ruff]
target-version = "py314"
